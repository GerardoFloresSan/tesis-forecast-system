<header class="app-header" *ngIf="authService.isAuthenticated()">
  <div>
    <strong>Forecast System</strong>
    <span>
      {{ authService.currentUser()?.full_name || 'Analista operativo' }}
      · {{ authService.currentUser()?.role || 'analista_operativo' }}
    </span>
  </div>

  <button type="button" (click)="logout()">
    Cerrar sesión
  </button>
</header>
